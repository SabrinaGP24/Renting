# =============================================================================
# Renting - bases de datos locales
#
# La aplicacion arranca por defecto con repositorios en memoria y NO necesita
# nada de esto. Estos servicios solo hacen falta si en App.config se cambia
# PersistenceProvider a Oracle o a SqlServer.
#
# Cada motor esta detras de un perfil, para levantar solo el que se quiera:
#
#   docker compose --profile oracle    up -d
#   docker compose --profile sqlserver up -d
#
# Ambos crean el esquema automaticamente a partir de los scripts de database/.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Oracle XE. Los .sql de database/oracle se ejecutan solos la primera vez que
  # arranca el contenedor (orden alfabetico), como SYS sobre la instancia XE.
  # Cadena de conexion: User Id=RENTING;Password=renting;Data Source=localhost:1521/XEPDB1;
  # ---------------------------------------------------------------------------
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: renting-oracle
    profiles: ["oracle"]
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle          # usuarios SYS y SYSTEM
      APP_USER: RENTING                # esquema de la aplicacion
      APP_USER_PASSWORD: renting
    volumes:
      - ./database/oracle:/container-entrypoint-initdb.d:ro
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ---------------------------------------------------------------------------
  # SQL Server. La imagen no ejecuta scripts de inicializacion por si misma,
  # de ahi el servicio sqlserver-init de abajo.
  # Cadena de conexion: Server=localhost,1433;Database=RENTING;User Id=sa;Password=Renting_2024!;TrustServerCertificate=True;
  # ---------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: renting-sqlserver
    profiles: ["sqlserver"]
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Renting_2024!"
      MSSQL_PID: "Developer"
    volumes:
      - sqlserver-data:/var/opt/mssql

  # ---------------------------------------------------------------------------
  # Espera a que SQL Server acepte conexiones y aplica los scripts en orden.
  # Termina y se queda parado; es normal verlo como "exited (0)".
  # ---------------------------------------------------------------------------
  sqlserver-init:
    image: mcr.microsoft.com/mssql-tools18:latest
    container_name: renting-sqlserver-init
    profiles: ["sqlserver"]
    depends_on:
      - sqlserver
    environment:
      MSSQL_SA_PASSWORD: "Renting_2024!"
    volumes:
      - ./database/sqlserver:/scripts:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        for i in $$(seq 1 60); do
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1 && break
          echo "Esperando a SQL Server... ($$i)"
          sleep 3
        done
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i /scripts/01-create-schema.sql &&
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i /scripts/02-alter-schema.sql &&
        echo "Esquema RENTING creado."

volumes:
  oracle-data:
  sqlserver-data:
